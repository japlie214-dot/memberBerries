[workspace]
resolver = "2"
members = ["crates/memb", "crates/memb-core", "crates/memb-store", "crates/memb-scroll", "crates/memb-win", "crates/memb-embed", "crates/memb-rag", "crates/memb-curator", "crates/memb-ops"]

[workspace.package]
version = "0.13.3"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2.6"
regex = "1"
toml = "0.9"
