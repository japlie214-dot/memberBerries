# memb config.toml: optional. Copy to <data dir>\config.toml
# (default data dir: %LOCALAPPDATA%\memberBerries, or the absolute MEMB_DATA_DIR).
#
# Every uncommented value below is the shipped default. Settings that are commented out
# are off by default; the value shown for them is only an example.
# Precedence: environment variable > this file > default.
# A typo, an unknown key or an out-of-range value stops the command (a hook skips its
# event instead) with a message that names the setting (or the line, for a syntax or
# type error); nothing is silently ignored. Never put secrets in this file.
# See wiki/Configuration.md.

[storage]
max_notes = 50000            # 1..=50000; lowers the note limit, never raises it

[scroll]                     # opt-in chat capture (needs MEMB_SCROLL_CAPTURE=1; see wiki/Hooks.md)
max_messages = 90            # 10..=1000: a scroll that reaches this many messages becomes a chunk
retain_tail = 10             # 1..=max_messages/2: messages kept as overlap after a rollover
min_prompt_chars = 100       # prompts shorter than this never trigger note retrieval
dedup_reset_every_n_chunks = 7   # a note may be injected again once the chunk count crosses a multiple of this (1 to N new chunks later)
ignore_dirs = []             # patterns such as "*/tmp/*": matching working directories are never captured

[embeddings]
enabled = true               # false forces lexical-only search
# Off by default. Setting a port SENDS note text and queries to that loopback service
# (a llama-server you start yourself; memb does not launch it).
# port = 18432
# model_id = "embeddinggemma-300m-q8"    # names the vector cache; required for a useful cache with a port
# Off by default. In-process EmbeddingGemma 2 (ONNX); %VAR% is expanded, the path must be absolute.
# gemma_model_dir = "%LOCALAPPDATA%\\memberBerries\\models\\embeddinggemma-2"   # not needed after `memb models install`
# Cloud embeddings through Snowflake AI_EMBED. SENDS note titles, descriptions and queries to Snowflake;
# used only when no local model is chosen or installed. key_file is the PATH of an unencrypted PKCS#8 .p8; never paste a key here.
# [embeddings.snowflake]
# account = "ab14212.ap-southeast-1"
# user = "YOUR_USER"
# warehouse = "YOUR_WAREHOUSE"
# role = "YOUR_ROLE"                          # optional
# model = "snowflake-arctic-embed-m-v1.5"     # default
# key_file = "%LOCALAPPDATA%\\memberBerries\\secrets\\snowflake_private_key.p8"
# auto_download = false      # true: the daily routine downloads the model (207 MB, verified) if none is installed
# mrl_dim = 256              # one of 128, 256, 512, 768: shorter vectors (Matryoshka); omit for full width

# The kit's `binary` and `model_path` keys are rejected: memb never starts an embedding server.

[retrieval]                  # what a search returns and what a hook may put into a prompt (see wiki/Hooks.md)
max_inject_tokens = 750      # 50..=8000: most text one hook injects, about 4 bytes a token (750 = 3000 bytes); notes are added best match first and one that would not fit is left out
top_k = 5                    # 1..=20: notes a search starts from, before parents and children are added (at most 8, or top_k if larger)
score_floor = 0.60           # 0.0..=0.95: a vector match whose cosine is at or below this is dropped (see evidence/t032-injection-floor.md)

[curator]                    # used by `memb curate` (you run it; see wiki/Operations.md)
backend = "cli"              # the only supported backend
cli_command = "agy --model gemini-4-hydrogen-medium --disable-slash-commands --input-format stream-json --output-format stream-json --print-timeout 150s"
                             # run WITHOUT a shell, split on whitespace; it receives conversation text on stdin.
                             # Default: Antigravity agy, gemini-4-hydrogen-medium (verified, agy 1.5.15). An agy
                             # command speaks agy's stream protocol and runs with an empty home directory so none
                             # of your Antigravity plugins, MCP servers or rules load.
# fallback_command = "codex exec -m gpt-6-luna -c model_reasoning_effort=medium -s read-only --skip-git-repo-check --ephemeral --ignore-user-config --ignore-rules -c project_doc_max_bytes=0 --disable apps --disable plugins --disable hooks --disable goals --disable multi_agent --disable in_app_browser --disable browser_use --disable computer_use --disable tool_suggest --disable skill_search --disable skill_mcp_dependency_install --disable view_image --disable sleep_tool --disable remote_plugin --disable plugin_sharing --disable memories"
                             # Tried when cli_command fails or its quota is used up. Unset (as here): Codex
                             # gpt-6-luna at medium reasoning, shown here, when cli_command is the default agy
                             # command, otherwise none. "" turns the fallback off. The Codex command is "pure":
                             # --ignore-user-config/--ignore-rules/--disable ... keep your Codex plugins, apps,
                             # skills, hooks, memories and AGENTS.md out of the headless call.
                             # A model that reports its quota used up is not called again until the time it
                             # named (or 15 min, doubling to 6 h); see wiki/Operations.md.
chunk_to_chunk_threshold = 0.72   # fixed: any other value is rejected
chunk_to_node_threshold = 0.70    # fixed: any other value is rejected
staging_ttl_days = 30        # 1..=365: staged evidence and unanswered proposals expire after this
daemon_enabled = false       # true: `memb daemon` runs curation once a day, i.e. sends staged conversation
                             # text to cli_command with nobody at the keyboard. Proposals still wait for you
                             # unless auto_apply is also true.
auto_apply = false           # true: valid proposals are applied without a typed confirmation (full auto-apply, decided
                             # 2026-11-25). Safety net: every edit is recorded and `memb proposals rollback <id>`
                             # reverses it; `memb proposals pause` is the kill switch; `memb proposals audit` lists them.
max_auto_edits = 5           # 1..=50: most proposals one run applies by itself; the rest wait for review

[scheduler]                  # used by `memb daemon`
routine_wib_hour = 15        # 0..=23, Western Indonesia Time (UTC+7)
routine_wib_minute = 45      # 0..=59
cooldown_hours = 20          # 1..=168: minimum time between successful runs
idle_sweep_hours = 24        # 1..=720: scrolls idle longer than this are chunked
idle_sweep_min_messages = 45 # must exceed scroll.retain_tail
# obsidian_mirror_dir = "%LOCALAPPDATA%\\memberBerries\\vault"   # absolute, existing; `daemon --mirror-out` overrides
