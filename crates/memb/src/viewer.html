<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memb Inspector</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f1;--panel:#fff;--ink:#202423;--muted:#565f58;--line:#cdd6ce;--accent:#245940;--accent-text:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#191e1c;--panel:#232b26;--ink:#eff4ef;--muted:#b8c8bf;--line:#49574f;--accent:#a7dfb7;--accent-text:#182b20}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}main{max-width:920px;margin:auto;padding:clamp(16px,4vw,44px)}header p,small,#status{color:var(--muted)}h1,h2,p{margin:0}h1{font-size:clamp(30px,6vw,54px);line-height:1.05;letter-spacing:-.045em;margin:.25em 0}.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}form,nav{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:24px 0 14px}label{display:grid;gap:4px;flex:1 1 145px;font-weight:600}input,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0}button:not(:disabled){cursor:pointer}button:disabled{opacity:.55}button[type=submit]{background:var(--accent);color:var(--accent-text);font-weight:700}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:18px 0}dl div,details{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px}dt{color:var(--muted)}dd{margin:0;font-size:1.6rem;font-weight:650}details{margin-bottom:8px;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:650}details p{white-space:pre-wrap;margin-top:8px}nav{justify-content:space-between}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
</style></head><body><main>
<header><p class="eyebrow">memberBerries · Read only</p><h1>Memory inspector</h1><p>Browse stored notes and check project totals. Nothing here saves or deletes memory.</p></header>
<form id="filters"><label>Project<input id="project" required maxlength="64" pattern="[a-z0-9][a-z0-9_\-]{0,63}" placeholder="orchard-demo" autocapitalize="off" autocomplete="off"></label><label>Filter notes<input id="query" maxlength="512" placeholder="Title or note text" autocomplete="off"></label><button id="load" type="submit">Load project</button></form>
<p id="status" role="status">Enter a project to inspect.</p>
<dl id="counts" hidden></dl><section id="results" aria-label="Notes"></section>
<nav id="pages" hidden aria-label="Note pages"><button id="back" type="button">Previous</button><button id="refresh" type="button">Refresh page</button><button id="next" type="button">Next</button></nav>
</main><script>
'use strict';
const el = id => document.getElementById(id), hostMode = self !== parent;
let selected = null, cursors = ['0'], index = 0, nextCursor = null, running = false, seq = 0;
const pending = new Map();
const send = data => parent.postMessage({jsonrpc:'2.0', ...data}, '*');
function rpc(method, params) {
  return new Promise((resolve,reject)=>{
    const id = `memb-${++seq}`;
    const timer = setTimeout(()=>{pending.delete(id);reject(new Error('The connector did not respond.'));},12000);
    pending.set(id,{resolve,reject,timer}); send({id,method,params});
  });
}
if (hostMode) {
  addEventListener('message', ({source,data:m}) => {
    if(source!==parent || !m || m.jsonrpc!=='2.0') return;
    if(pending.has(m.id) && ('result' in m || 'error' in m)){
      const p=pending.get(m.id); pending.delete(m.id); clearTimeout(p.timer);
      return m.error?p.reject(new Error('Host rejected the inspector request.')):p.resolve(m.result);
    }
    if (m.method==='ui/notifications/tool-result') {
      const project=m.params?.structuredContent?.project;
      if(typeof project==='string' && !selected && !el('project').value){el('project').value=project;el('filters').requestSubmit();}
    }
    if (m.method==='ui/resource-teardown' && 'id' in m) send({id:m.id,result:{}});
  });
  el('load').disabled=true;
  rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Memb Inspector',version:'0.2.0'},appCapabilities:{}}).then(()=>{
    send({method:'ui/notifications/initialized'});el('load').disabled=false;
    if(typeof ResizeObserver!=='undefined') new ResizeObserver(()=>send({method:'ui/notifications/size-changed',params:{height:document.querySelector('main').offsetHeight}})).observe(document.querySelector('main'));
  }).catch(e=>{el('status').textContent=e.message+' Use the local web inspector instead.';});
}
async function get(args) {
  if(hostMode){
    const res=await rpc('tools/call',{name:'inspector_snapshot',arguments:args});
    if(res.isError) throw new Error(res.content?.[0]?.text || 'Cannot read memory.');
    return res.structuredContent;
  }
  const key=location.hash.slice(1);
  if(!/^[0-9a-f]{32}$/.test(key))throw new Error('Open the complete private URL printed by memb web.');
  const res=await fetch('/api/snapshot?'+new URLSearchParams(args),{headers:{'X-Memb-Viewer':key},cache:'no-store'});
  if(res.status===403)throw new Error('Access denied. Open the private URL from the current memb web process.');
  const data=await res.json(); if(!res.ok) throw new Error(data.error || 'Cannot read memory.'); return data;
}
function node(tag,text){ const n=document.createElement(tag); n.textContent=text; return n; }
async function load(target){
  if(running)return;
  running=true; el('load').disabled=true; el('pages').hidden=true; el('counts').hidden=true; el('results').replaceChildren();
  el('status').textContent='Reading project…';
  try{
    const data=await get({...selected,after:cursors[target]});
    if(!data?.counts || !Array.isArray(data.notes))throw new Error('The connector did not return a snapshot.');
    index=target; nextCursor=data.next;
    el('counts').replaceChildren(...[['Total','total'],['Topics','topics'],['Knowledge','knowledge'],['Claims','claims']].map(([label,key])=>{
      const row=document.createElement('div');row.append(node('dt',label),node('dd',data.counts[key]));return row;
    }));el('counts').hidden=false;
    el('results').replaceChildren(...data.notes.map(n=>{
      const card=document.createElement('details');
      card.append(node('summary',`#${n.id} · ${n.title}`),node('small',`${n.kind}${n.parents.length?' · Parents '+n.parents.join(', '):''}`),node('p',n.body));return card;
    }));
    el('status').textContent=`${data.project} · ${data.notes.length ? `Page ${index+1} · ${data.notes.length} notes shown` : 'No matching notes'} · Read at ${new Date().toLocaleTimeString()}`;
    el('pages').hidden=false;el('back').disabled=index===0;el('next').disabled=!nextCursor;
  }catch(e){el('status').textContent=e.message;}finally{running=false;el('load').disabled=false;}
}
el('filters').addEventListener('submit',e=>{e.preventDefault();if(running)return;selected={project:el('project').value,query:el('query').value};cursors=['0'];load(0);});
el('next').onclick=()=>{if(nextCursor&&!running){cursors[index+1]=nextCursor;load(index+1);}};
el('back').onclick=()=>{if(index&&!running)load(index-1);};el('refresh').onclick=()=>load(index);
</script></body></html>
